name: Automated Regression Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'STAGING'
        type: choice
        options:
          - SIT
          - STAGING
      tags:
        description: 'Test Tag to Run (e.g. Smoke, PLUS12)'
        required: false
        default: 'Smoke'

jobs:
  test:
    name: Run Robot Framework E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Google Chrome (Headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip libxi6 libgconf-2-4 libnss3
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Robot Framework Tests
        run: |
          mkdir -p results
          robot --variable HEADLESS:true \
                --variable ENV_NAME:${{ github.event.inputs.environment || 'STAGING' }} \
                --include ${{ github.event.inputs.tags || 'Smoke' }} \
                --outputdir results \
                tests/
        continue-on-error: true

      - name: Publish Test Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-framework-test-report
          path: |
            results/log.html
            results/report.html
            results/output.xml
            results/*.png
          retention-days: 14
